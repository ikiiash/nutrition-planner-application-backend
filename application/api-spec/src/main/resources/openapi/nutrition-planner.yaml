openapi: 3.0.3
info:
  title: Nutrition Planner
  description: API for Nutrition Planner application
  version: 1.0.0

servers:
  - url: http://localhost:8080

security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: OK
  /food-products:
    get:
      summary: List food products
      operationId: readFoodProducts
      tags:
        - FoodProduct
      parameters:
        - name: name
          in: query
          required: false
          description: Optional case-insensitive name filter.
          schema:
            type: string
      responses:
        '200':
          description: Food products returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FoodProduct'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create a new food product
      operationId: createFoodProduct
      tags:
        - FoodProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFoodProductRequest'
      responses:
        '201':
          description: Food product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodProduct'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /user-profile/me:
    get:
      summary: Read current user profile
      operationId: readCurrentUserProfile
      tags:
        - UserProfile
      responses:
        '200':
          description: User profile returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Create or update current user profile
      operationId: updateCurrentUserProfile
      tags:
        - UserProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileRequest'
      responses:
        '200':
          description: User profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /meals:
    get:
      summary: List meals
      operationId: readMeals
      tags:
        - Meal
      responses:
        '200':
          description: Meals returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Meal'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create a new meal
      operationId: createMeal
      tags:
        - Meal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMealRequest'
      responses:
        '201':
          description: Meal created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meal'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /meals/{mealId}:
    get:
      summary: Read meal by id
      operationId: readMeal
      tags:
        - Meal
      parameters:
        - $ref: '#/components/parameters/MealId'
      responses:
        '200':
          description: Meal returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meal'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Meal not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update meal
      operationId: updateMeal
      tags:
        - Meal
      parameters:
        - $ref: '#/components/parameters/MealId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMealRequest'
      responses:
        '200':
          description: Meal updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meal'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Meal not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete meal
      operationId: deleteMeal
      tags:
        - Meal
      parameters:
        - $ref: '#/components/parameters/MealId'
      responses:
        '204':
          description: Meal deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Meal not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /meal-plans:
    get:
      summary: List meal plans
      operationId: readMealPlans
      tags:
        - MealPlan
      responses:
        '200':
          description: Meal plans returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MealPlan'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create a new meal plan
      operationId: createMealPlan
      tags:
        - MealPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMealPlanRequest'
      responses:
        '201':
          description: Meal plan created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealPlan'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /meal-plans/{mealPlanId}:
    get:
      summary: Read meal plan by id
      operationId: readMealPlan
      tags:
        - MealPlan
      parameters:
        - $ref: '#/components/parameters/MealPlanId'
      responses:
        '200':
          description: Meal plan returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealPlan'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Meal plan not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update meal plan
      operationId: updateMealPlan
      tags:
        - MealPlan
      parameters:
        - $ref: '#/components/parameters/MealPlanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMealPlanRequest'
      responses:
        '200':
          description: Meal plan updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealPlan'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Meal plan not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete meal plan
      operationId: deleteMealPlan
      tags:
        - MealPlan
      parameters:
        - $ref: '#/components/parameters/MealPlanId'
      responses:
        '204':
          description: Meal plan deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Meal plan not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /meal-plans/{mealPlanId}/activate:
    put:
      summary: Activate a meal plan
      operationId: activateMealPlan
      tags:
        - MealPlan
      parameters:
        - $ref: '#/components/parameters/MealPlanId'
      responses:
        '200':
          description: Meal plan activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealPlan'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Meal plan not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /meal-plans/{mealPlanId}/deactivate:
    put:
      summary: Deactivate a meal plan
      operationId: deactivateMealPlan
      tags:
        - MealPlan
      parameters:
        - $ref: '#/components/parameters/MealPlanId'
      responses:
        '200':
          description: Meal plan deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealPlan'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Meal plan not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /meal-plans/{mealPlanId}/days/{dayId}/entries:
    post:
      summary: Add entry to a plan day
      operationId: addPlanEntry
      tags:
        - MealPlan
      parameters:
        - $ref: '#/components/parameters/MealPlanId'
        - $ref: '#/components/parameters/DayId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddPlanEntryRequest'
      responses:
        '201':
          description: Entry added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanEntry'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Meal plan or day not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /meal-plans/{mealPlanId}/days/{dayId}/entries/{entryId}:
    delete:
      summary: Remove entry from a plan day
      operationId: removePlanEntry
      tags:
        - MealPlan
      parameters:
        - $ref: '#/components/parameters/MealPlanId'
        - $ref: '#/components/parameters/DayId'
        - $ref: '#/components/parameters/EntryId'
      responses:
        '204':
          description: Entry removed
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /food-products/{foodProductId}:
    get:
      summary: Read food product by id
      operationId: readFoodProduct
      tags:
        - FoodProduct
      parameters:
        - $ref: '#/components/parameters/FoodProductId'
      responses:
        '200':
          description: Food product returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodProduct'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Food product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update food product
      operationId: updateFoodProduct
      tags:
        - FoodProduct
      parameters:
        - $ref: '#/components/parameters/FoodProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFoodProductRequest'
      responses:
        '200':
          description: Food product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodProduct'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Food product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete food product
      operationId: deleteFoodProduct
      tags:
        - FoodProduct
      parameters:
        - $ref: '#/components/parameters/FoodProductId'
      responses:
        '204':
          description: Food product deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Food product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /food-products/{foodProductId}/fridge:
    patch:
      summary: Set fridge status for a food product
      operationId: setFridgeStatus
      tags:
        - FoodProduct
      parameters:
        - $ref: '#/components/parameters/FoodProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetFridgeStatusRequest'
      responses:
        '200':
          description: Fridge status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodProduct'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Food product not found

  /ai/chat:
    post:
      summary: Chat with AI nutrition assistant
      operationId: aiChat
      tags:
        - AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiChatRequest'
      responses:
        '200':
          description: AI response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiChatResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: AI provider error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /ai/chats:
    get:
      summary: List chat sessions
      operationId: listChatSessions
      tags:
        - AI
      responses:
        '200':
          description: Sessions list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatSessionSummary'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create a new chat session
      operationId: createChatSession
      tags:
        - AI
      responses:
        '201':
          description: Chat session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionDetail'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /ai/chats/{chatId}:
    get:
      summary: Get chat session with messages
      operationId: getChatSession
      tags:
        - AI
      parameters:
        - $ref: '#/components/parameters/ChatId'
      responses:
        '200':
          description: Chat session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionDetail'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete chat session
      operationId: deleteChatSession
      tags:
        - AI
      parameters:
        - $ref: '#/components/parameters/ChatId'
      responses:
        '204':
          description: Deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /ai/chats/{chatId}/messages:
    post:
      summary: Send a message to a chat session
      operationId: sendChatMessage
      tags:
        - AI
      parameters:
        - $ref: '#/components/parameters/ChatId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendChatMessageRequest'
      responses:
        '200':
          description: AI response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendChatMessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: AI provider error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /ai/autofill:
    post:
      summary: Auto-fill nutrition values by product name
      operationId: aiAutofill
      tags:
        - AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiAutofillRequest'
      responses:
        '200':
          description: Nutrition values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiAutofillResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: AI provider error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /shopping-list:
    get:
      summary: List shopping list items
      operationId: readShoppingList
      tags:
        - ShoppingList
      responses:
        '200':
          description: Shopping list items returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShoppingListItem'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Add item to shopping list
      operationId: addShoppingListItem
      tags:
        - ShoppingList
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveShoppingListItemRequest'
      responses:
        '201':
          description: Item added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingListItem'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Clear shopping list
      operationId: clearShoppingList
      tags:
        - ShoppingList
      responses:
        '204':
          description: Shopping list cleared
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /shopping-list/{itemId}:
    put:
      summary: Update shopping list item
      operationId: updateShoppingListItem
      tags:
        - ShoppingList
      parameters:
        - $ref: '#/components/parameters/ShoppingListItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveShoppingListItemRequest'
      responses:
        '200':
          description: Item updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingListItem'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete shopping list item
      operationId: deleteShoppingListItem
      tags:
        - ShoppingList
      parameters:
        - $ref: '#/components/parameters/ShoppingListItemId'
      responses:
        '204':
          description: Item deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    MealId:
      name: mealId
      in: path
      required: true
      schema:
        type: integer
        format: int64

    MealPlanId:
      name: mealPlanId
      in: path
      required: true
      schema:
        type: integer
