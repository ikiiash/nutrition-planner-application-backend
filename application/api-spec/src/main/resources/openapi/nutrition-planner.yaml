openapi: 3.0.3
info:
  title: Nutrition Planner
  description: API for Nutrition Planner application
  version: 1.0.0

servers:
  - url: http://localhost:8080

security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: OK
  /food-products:
    get:
      summary: List food products
      operationId: readFoodProducts
      tags:
        - FoodProduct
      parameters:
        - name: name
          in: query
          required: false
          description: Optional case-insensitive name filter.
          schema:
            type: string
      responses:
        '200':
          description: Food products returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FoodProduct'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create a new food product
      operationId: createFoodProduct
      tags:
        - FoodProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFoodProductRequest'
      responses:
        '201':
          description: Food product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodProduct'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /food-products/{foodProductId}:
    get:
      summary: Read food product by id
      operationId: readFoodProduct
      tags:
        - FoodProduct
      parameters:
        - $ref: '#/components/parameters/FoodProductId'
      responses:
        '200':
          description: Food product returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodProduct'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Food product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update food product
      operationId: updateFoodProduct
      tags:
        - FoodProduct
      parameters:
        - $ref: '#/components/parameters/FoodProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFoodProductRequest'
      responses:
        '200':
          description: Food product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodProduct'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Food product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete food product
      operationId: deleteFoodProduct
      tags:
        - FoodProduct
      parameters:
        - $ref: '#/components/parameters/FoodProductId'
      responses:
        '204':
          description: Food product deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Food product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    FoodProductId:
      name: foodProductId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  schemas:
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string

    CreateFoodProductRequest:
      type: object
      required:
        - name
        - calories
        - protein
        - fat
        - carbohydrates
        - price
      properties:
        name:
          type: string
          minLength: 1
          pattern: "^.*\\S.*$"
        calories:
          type: number
          format: double
          minimum: 0
        protein:
          type: number
          format: double
          minimum: 0
        fat:
          type: number
          format: double
          minimum: 0
        carbohydrates:
          type: number
          format: double
          minimum: 0
        price:
          type: number
          format: double
          minimum: 0

    UpdateFoodProductRequest:
      type: object
      required:
        - name
        - calories
        - protein
        - fat
        - carbohydrates
        - price
      properties:
        name:
          type: string
          minLength: 1
          pattern: "^.*\\S.*$"
        calories:
          type: number
          format: double
          minimum: 0
        protein:
          type: number
          format: double
          minimum: 0
        fat:
          type: number
          format: double
          minimum: 0
        carbohydrates:
          type: number
          format: double
          minimum: 0
        price:
          type: number
          format: double
          minimum: 0

    FoodProduct:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier of the food product.
          readOnly: true
        name:
          type: string
          description: Food product name.
        calories:
          type: number
          format: double
          description: Energy value.
        protein:
          type: number
          format: double
          description: Protein amount.
        fat:
          type: number
          format: double
          description: Fat amount.
        carbohydrates:
          type: number
          format: double
          description: Carbohydrates amount.
        price:
          type: number
          format: double
          description: Food product price.
