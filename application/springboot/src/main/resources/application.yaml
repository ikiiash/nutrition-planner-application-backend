openai:
  api-key: ${OPENAI_API_KEY:}

spring:
  application:
    name: nutrition-planner

  datasource:
    url: jdbc:postgresql://localhost:5433/nutrition_planner
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
    name: nutrition-planner-db

  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    mapping-resources:
      - persistence/nutrition-planner-orm.xml

  liquibase:
    change-log: persistence/db/changelog/changelog-master.xml

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  endpoints:
    web:
      exposure:
        include: "*"

---
spring:
  config:
    activate:
      on-profile: keycloak
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/NUTRITION
          jwk-set-uri: http://localhost:8081/realms/NUTRITION/protocol/openid-connect/certs
