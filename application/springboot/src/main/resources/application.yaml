spring:
  application:
    name: nutrition-planner

  datasource:
    url: jdbc:h2:mem:nutritionplanner;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  sql:
    init:
      mode: always

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    mapping-resources:
      - META-INF/orm.xml

  h2:
    console:
      enabled: true